name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-compatibility:
    name: Debian ${{ matrix.release }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        release: ['12', '13']
    container: debian:${{ matrix.release }}-slim
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bash ca-certificates coreutils findutils git grep openssl passwd \
            python3 sed shellcheck util-linux

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run static checks
        run: bash tests/test-static.sh

      - name: Run unit checks
        run: bash tests/test-units.sh

      - name: Run Linux integration checks
        run: bash tests/test-linux-integration.sh

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck nftables

      - name: Static and generator checks
        run: |
          bash tests/test-static.sh
          python3 tools/site_generator.py --audit 100 --seed repository-audit

      - name: Render configurations
        env:
          RW_TEST_OUTPUT: ${{ github.workspace }}/test-output
        run: bash tests/test-units.sh

      - name: Validate nftables syntax
        run: sudo nft --check --file test-output/firewall.nft

      - name: Exercise nftables idempotency in an isolated network namespace
        run: |
          sudo ip netns add rw-node-ci
          trap 'sudo ip netns delete rw-node-ci' EXIT
          sudo ip netns exec rw-node-ci src/scripts/rw-node-firewall-apply test-output/firewall.nft
          sudo ip netns exec rw-node-ci src/scripts/rw-node-firewall-apply test-output/firewall.nft
          sudo ip netns exec rw-node-ci nft list table inet rw_node_guard >/dev/null

      - name: Exercise nftables rollback helper in an isolated network namespace
        run: |
          sudo ip netns add rw-node-rollback-ci
          trap 'sudo ip netns delete rw-node-rollback-ci' EXIT
          sudo install -d -m 0700 /run/rw-node-installer
          sudo touch /run/rw-node-installer/firewall-before.ci.nft
          sudo touch /run/rw-node-installer/firewall-pending
          sudo ip netns exec rw-node-rollback-ci src/scripts/rw-node-firewall-apply test-output/firewall.nft
          sudo ip netns exec rw-node-rollback-ci src/scripts/rw-node-firewall-rollback \
            /run/rw-node-installer/firewall-before.ci.nft \
            /run/rw-node-installer/firewall-pending
          if sudo ip netns exec rw-node-rollback-ci nft list table inet rw_node_guard >/dev/null 2>&1; then
            echo 'Rollback did not remove the test table.' >&2
            exit 1
          fi

      - name: Validate Caddyfile syntax
        run: |
          docker run --rm \
            --user 10001:10001 \
            --env HOME=/tmp/caddy-home \
            -v "$PWD/test-output/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate

      - name: Validate Docker Compose model
        working-directory: test-output
        run: docker compose config --quiet

      - name: Exercise certificate synchronization boundary
        run: sudo bash tests/test-linux-integration.sh
